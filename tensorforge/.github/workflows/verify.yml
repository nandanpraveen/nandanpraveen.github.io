name: Verify RTL and host driver
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: tensorforge-results
          path: |
            results/
            build/*.vcd
            build/synth-*.log
